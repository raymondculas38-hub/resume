  <circle cx="472" cy="168" r="4" fill="#22c55e"/>
  <rect x="483" y="163" width="80" height="7" rx="3" fill="#334155"/>
  <circle cx="472" cy="190" r="4" fill="#8b5cf6"/>
  <rect x="483" y="185" width="65" height="7" rx="3" fill="#334155"/>
  <circle cx="472" cy="212" r="4" fill="#f59e0b"/>
  <rect x="483" y="207" width="72" height="7" rx="3" fill="#334155"/>
  <circle cx="472" cy="234" r="4" fill="#ec4899"/>
  <rect x="483" y="229" width="58" height="7" rx="3" fill="#334155"/>
  <circle cx="472" cy="256" r="4" fill="#06b6d4"/>
  <rect x="483" y="251" width="75" height="7" rx="3" fill="#334155"/>
  <circle cx="472" cy="278" r="4" fill="#22c55e"/>
  <rect x="483" y="273" width="60" height="7" rx="3" fill="#334155"/>
