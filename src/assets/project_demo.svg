  <rect x="178" y="318" width="60" height="24" rx="6" fill="#4f46e5" opacity="0.8"/>
  <text x="208" y="334" font-family="Outfit,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">React</text>
  <rect x="248" y="318" width="80" height="24" rx="6" fill="#0e7490" opacity="0.8"/>
  <text x="288" y="334" font-family="Outfit,sans-serif" font-size="10" fill="#67e8f9" text-anchor="middle">TypeScript</text>
